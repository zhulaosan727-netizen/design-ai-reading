<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" data-accent="#2A7A42">
  <!-- 读本 cover system v1 · No.61 · human-readable guidelines become tool-usable context; trust is tested on realistic, populated prototypes, not empty vaults -->
  <rect width="1200" height="750" fill="#E6E6E6"/>
  <g stroke="#1B2B26" stroke-opacity=".12" stroke-width="1"><path d="M60 0V750M1140 0V750M0 90H1200M0 660H1200"/></g>
  <text x="60" y="62" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26">读本 · NO.61 · AI 设计工作流</text>
  <text x="1140" y="62" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26" fill-opacity=".6">RULES THE TOOL CAN USE</text>

  <!-- LEFT: a stack of human-readable guideline pages -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(8,10)" stroke-opacity=".35" stroke-width="1.4">
      <rect x="92" y="230" width="196" height="268" rx="2"/>
    </g>
    <g transform="translate(4,5)" stroke-opacity=".5" stroke-width="1.5">
      <rect x="92" y="230" width="196" height="268" rx="2"/>
    </g>
    <rect x="92" y="230" width="196" height="268" rx="2"/>
    <path d="M118 268 H248" stroke-width="1.6"/>
    <path d="M118 292 H268" stroke-width="1.45" stroke-opacity=".55"/>
    <path d="M118 312 H252" stroke-width="1.45" stroke-opacity=".55"/>
    <path d="M118 332 H260" stroke-width="1.45" stroke-opacity=".55"/>
    <path d="M118 352 H240" stroke-width="1.45" stroke-opacity=".45"/>
    <path d="M118 390 H248" stroke-width="1.5"/>
    <path d="M118 410 H268" stroke-width="1.4" stroke-opacity=".5"/>
    <path d="M118 430 H244" stroke-width="1.4" stroke-opacity=".5"/>
    <path d="M118 450 H258" stroke-width="1.4" stroke-opacity=".5"/>
    <path d="M118 470 H236" stroke-width="1.4" stroke-opacity=".4"/>
  </g>

  <!-- CENTER: the one accent — guardrails that turn pages into context a tool can follow -->
  <g fill="none" stroke="#2A7A42" stroke-width="1.85" stroke-opacity=".9" stroke-linecap="round" stroke-linejoin="round">
    <!-- twin rails -->
    <path d="M322 330 H534"/>
    <path d="M322 430 H534"/>
    <!-- rail posts / sleepers: the rules, evenly spaced -->
    <path d="M354 330 V430" stroke-width="1.5" stroke-opacity=".75"/>
    <path d="M394 330 V430" stroke-width="1.5" stroke-opacity=".75"/>
    <path d="M434 330 V430" stroke-width="1.5" stroke-opacity=".75"/>
    <path d="M474 330 V430" stroke-width="1.5" stroke-opacity=".75"/>
    <path d="M514 330 V430" stroke-width="1.5" stroke-opacity=".75"/>
    <!-- context block riding the rails: a compact, structured card the agent can load -->
    <rect x="368" y="348" width="120" height="64" rx="3" fill="#E6E6E6" stroke="#2A7A42"/>
    <path d="M384 368 H472" stroke-width="1.5"/>
    <path d="M384 384 H456" stroke-width="1.4" stroke-opacity=".7"/>
    <path d="M384 398 H444" stroke-width="1.4" stroke-opacity=".55"/>
    <!-- entry from the human docs -->
    <path d="M288 375 H322" stroke-width="1.6" stroke-opacity=".7"/>
    <!-- exit toward the playground -->
    <path d="M534 380 H586" stroke-width="1.6"/>
    <path d="M574 368 L586 380 L574 392" stroke-width="1.6"/>
  </g>

  <!-- RIGHT: visual branching — two coded prototypes, empty vault vs populated vault -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <!-- empty vault / sparse approve sheet -->
    <g>
      <rect x="602" y="230" width="236" height="300" rx="8"/>
      <path d="M622 258 H800" stroke-width="1.5"/>
      <path d="M622 278 H760" stroke-width="1.4" stroke-opacity=".5"/>
      <!-- empty chamber -->
      <rect x="646" y="310" width="148" height="130" rx="6" stroke-width="1.5" stroke-opacity=".55"/>
      <path d="M690 348 H750" stroke-opacity=".4" stroke-width="1.4"/>
      <path d="M704 366 H736" stroke-opacity=".35" stroke-width="1.4"/>
      <!-- a lone confirm pill, sitting in too much air -->
      <rect x="668" y="468" width="104" height="28" rx="14" stroke-width="1.5"/>
    </g>
    <!-- populated vault / realistic approve sheet -->
    <g>
      <rect x="862" y="230" width="236" height="300" rx="8"/>
      <path d="M882 258 H1060" stroke-width="1.5"/>
      <path d="M882 278 H1020" stroke-width="1.4" stroke-opacity=".5"/>
      <!-- stacked inventory -->
      <g stroke-width="1.45">
        <rect x="882" y="304" width="196" height="36" rx="4"/>
        <path d="M896 316 H1028" stroke-width="1.3"/>
        <path d="M896 328 H994" stroke-width="1.2" stroke-opacity=".45"/>
        <rect x="882" y="348" width="196" height="36" rx="4"/>
        <path d="M896 360 H1020" stroke-width="1.3"/>
        <path d="M896 372 H986" stroke-width="1.2" stroke-opacity=".45"/>
        <rect x="882" y="392" width="196" height="36" rx="4"/>
        <path d="M896 404 H1034" stroke-width="1.3"/>
        <path d="M896 416 H1000" stroke-width="1.2" stroke-opacity=".45"/>
      </g>
      <!-- pending agent request + confirm, still legible in the noise -->
      <rect x="882" y="440" width="196" height="68" rx="6" stroke-width="1.6"/>
      <path d="M896 458 H1040" stroke-width="1.45"/>
      <path d="M896 474 H1010" stroke-width="1.3" stroke-opacity=".5"/>
      <rect x="896" y="486" width="72" height="14" rx="7" stroke-width="1.4"/>
    </g>
    <!-- a faint compare bracket suggesting visual branching -->
    <g stroke-opacity=".4" stroke-width="1.4">
      <path d="M838 230 V246"/>
      <path d="M838 514 V530"/>
    </g>
  </g>

  <g font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1.5" fill="#1B2B26" fill-opacity=".45">
    <text x="92" y="628">GUIDELINES FOR HUMANS</text>
    <text x="354" y="628">CONTEXT THE TOOL LOADS</text>
    <text x="602" y="628">EMPTY VAULT</text>
    <text x="862" y="628">POPULATED / REAL</text>
  </g>

  <text x="60" y="708" font-family="Instrument Serif,Georgia,serif" font-style="italic" font-size="24" fill="#1B2B26">How 1Password uses Figma Make to design for trust and certainty</text>
  <text x="1140" y="708" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" letter-spacing="2" fill="#1B2B26" fill-opacity=".6">FIGMA BLOG</text>
</svg>
