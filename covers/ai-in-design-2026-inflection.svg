<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" data-accent="#C15A48">
  <!-- 读本 cover system v1 -->
  <rect width="1200" height="750" fill="#E6E6E6"/>
  <g stroke="#1B2B26" stroke-opacity=".12" stroke-width="1"><path d="M60 0V750M1140 0V750M0 90H1200M0 660H1200"/></g>
  <text x="60" y="62" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26">读本 · NO.32 · AI 设计工作流</text>
  <text x="1140" y="62" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26" fill-opacity=".6">INFLECTION POINT</text>
  <!-- motif: grid of identical small icons that diverge past a hinge into builders/tools -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <!-- left: uniform identical "designer" squares (pre-inflection) -->
    <path d="M140 200 H180 V240 H140 Z"/><path d="M200 200 H240 V240 H200 Z"/><path d="M260 200 H300 V240 H260 Z"/><path d="M320 200 H360 V240 H320 Z"/>
    <path d="M140 260 H180 V300 H140 Z"/><path d="M200 260 H240 V300 H200 Z"/><path d="M260 260 H300 V300 H260 Z"/><path d="M320 260 H360 V300 H320 Z"/>
    <path d="M140 320 H180 V360 H140 Z"/><path d="M200 320 H240 V360 H200 Z"/><path d="M260 320 H300 V360 H260 Z"/><path d="M320 320 H360 V360 H320 Z"/>
    <path d="M140 380 H180 V420 H140 Z"/><path d="M200 380 H240 V420 H200 Z"/><path d="M260 380 H300 V420 H260 Z"/><path d="M320 380 H360 V420 H320 Z"/>
    <path d="M140 440 H180 V480 H140 Z"/><path d="M200 440 H240 V480 H200 Z"/><path d="M260 440 H300 V480 H260 Z"/><path d="M320 440 H360 V480 H320 Z"/>
    <!-- tiny person marks inside first few (identical) -->
    <circle cx="160" cy="214" r="4"/><path d="M160 220 V232 M152 228 H168"/>
    <circle cx="220" cy="214" r="4"/><path d="M220 220 V232 M212 228 H228"/>
    <circle cx="280" cy="214" r="4"/><path d="M280 220 V232 M272 228 H288"/>
    <circle cx="340" cy="214" r="4"/><path d="M340 220 V232 M332 228 H348"/>
    <!-- flow lines toward hinge -->
    <path d="M370 220 H470" stroke-opacity=".4"/>
    <path d="M370 280 H470" stroke-opacity=".4"/>
    <path d="M370 340 H470" stroke-opacity=".4"/>
    <path d="M370 400 H470" stroke-opacity=".4"/>
    <path d="M370 460 H470" stroke-opacity=".4"/>
    <!-- right side: diverged builders — terminal, tool, prototype frame, agent node -->
    <path d="M700 180 H860 V280 H700 Z"/>
    <path d="M715 205 H845 M715 225 H820 M715 245 H835"/>
    <path d="M720 320 H800 V420 H720 Z"/>
    <path d="M735 350 L755 370 L785 335"/>
    <path d="M840 320 H980 V420 H840 Z"/>
    <path d="M855 345 H965 M855 365 H940 M855 385 H955"/>
    <path d="M760 460 H920 V560 H760 Z"/>
    <circle cx="840" cy="510" r="22"/>
    <path d="M840 495 V525 M825 510 H855"/>
  </g>
  <!-- accent: hinge / inflection bend + accent line through the bend -->
  <g fill="none" stroke="#C15A48" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M480 160 V580"/>
    <path d="M460 350 H500"/>
    <path d="M480 350 Q560 350 620 250"/>
    <path d="M480 350 Q560 350 640 450"/>
    <path d="M480 350 Q560 350 600 350"/>
    <!-- hinge pin -->
    <circle cx="480" cy="350" r="10"/>
    <circle cx="480" cy="350" r="4"/>
  </g>
  <g font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="1.5" fill="#1B2B26" fill-opacity=".5">
    <text x="140" y="175">UNIFORM · PRE</text>
    <text x="455" y="145">HINGE</text>
    <text x="700" y="165">BUILDERS · POST</text>
  </g>
  <text x="60" y="708" font-family="Instrument Serif,Georgia,serif" font-style="italic" font-size="28" fill="#1B2B26">AI in Design 2026: The inflection point is here</text>
  <text x="1140" y="708" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" letter-spacing="2" fill="#1B2B26" fill-opacity=".6">DESIGNER FUND</text>
</svg>
