<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" data-accent="#B54A5C">
  <!-- 读本 cover system v1 · No.59 · generated frames look finished and alike; authorship is the frictional press that molds material; closed workflows can reopen -->
  <rect width="1200" height="750" fill="#E6E6E6"/>
  <g stroke="#1B2B26" stroke-opacity=".12" stroke-width="1"><path d="M60 0V750M1140 0V750M0 90H1200M0 660H1200"/></g>
  <text x="60" y="62" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26">读本 · NO.59 · 独特审美</text>
  <text x="1140" y="62" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26" fill-opacity=".6">GENERATION ISN'T AUTHORSHIP</text>

  <!-- LEFT: open mode / identical generated material that already looks finished -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <!-- loose exploratory branches -->
    <g stroke-opacity=".45" stroke-width="1.4">
      <path d="M96 210 C70 190 68 150 96 136"/>
      <path d="M96 210 C78 230 64 248 80 268"/>
      <path d="M96 510 C70 528 66 568 92 588"/>
      <path d="M86 136 H118"/>
      <path d="M80 268 H108"/>
      <path d="M92 588 H124"/>
    </g>
    <!-- a generator node fanning into three same frames -->
    <circle cx="96" cy="375" r="10"/>
    <path d="M106 375 H132" stroke-opacity=".5"/>
    <!-- three identical 'finished' frames -->
    <g>
      <rect x="132" y="196" width="168" height="108" rx="3"/>
      <circle cx="156" cy="222" r="7"/>
      <path d="M172 218 H280" stroke-width="1.5" stroke-opacity=".55"/>
      <path d="M172 232 H252" stroke-width="1.5" stroke-opacity=".55"/>
      <path d="M148 250 H284"/>
      <path d="M148 268 H260" stroke-width="1.4" stroke-opacity=".5"/>
      <path d="M148 282 H236" stroke-width="1.4" stroke-opacity=".5"/>
    </g>
    <g>
      <rect x="132" y="321" width="168" height="108" rx="3"/>
      <circle cx="156" cy="347" r="7"/>
      <path d="M172 343 H280" stroke-width="1.5" stroke-opacity=".55"/>
      <path d="M172 357 H252" stroke-width="1.5" stroke-opacity=".55"/>
      <path d="M148 375 H284"/>
      <path d="M148 393 H260" stroke-width="1.4" stroke-opacity=".5"/>
      <path d="M148 407 H236" stroke-width="1.4" stroke-opacity=".5"/>
    </g>
    <g>
      <rect x="132" y="446" width="168" height="108" rx="3"/>
      <circle cx="156" cy="472" r="7"/>
      <path d="M172 468 H280" stroke-width="1.5" stroke-opacity=".55"/>
      <path d="M172 482 H252" stroke-width="1.5" stroke-opacity=".55"/>
      <path d="M148 500 H284"/>
      <path d="M148 518 H260" stroke-width="1.4" stroke-opacity=".5"/>
      <path d="M148 532 H236" stroke-width="1.4" stroke-opacity=".5"/>
    </g>
    <!-- feed from generator into the three frames -->
    <g stroke-opacity=".4" stroke-width="1.4">
      <path d="M96 365 C96 250 96 250 132 250"/>
      <path d="M106 375 H132"/>
      <path d="M96 385 C96 500 96 500 132 500"/>
    </g>
  </g>

  <!-- dashed skip: take the first polished frame as-is, bypass the press, dead-end -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.4" stroke-opacity=".38" stroke-linecap="round" stroke-dasharray="7 6">
    <path d="M300 250 C400 168 620 150 780 188"/>
  </g>
  <g fill="none" stroke="#1B2B26" stroke-width="1.5" stroke-opacity=".38" stroke-linecap="round" stroke-linejoin="round">
    <rect x="780" y="148" width="126" height="82" rx="3"/>
    <circle cx="798" cy="168" r="5"/>
    <path d="M810 165 H886" stroke-width="1.3"/>
    <path d="M810 176 H860" stroke-width="1.3"/>
    <path d="M792 190 H890"/>
    <path d="M792 204 H868" stroke-width="1.2"/>
    <!-- dead end: the unmolded copy never enters the rail -->
    <path d="M906 189 H948" stroke-dasharray="0"/>
    <path d="M948 189 L938 183 M948 189 L938 195" stroke-dasharray="0" stroke-opacity=".38"/>
  </g>

  <!-- path of material into the press (from the middle frame) -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round">
    <path d="M300 375 H448"/>
    <path d="M292 369 L300 375 L292 381" stroke-width="1.5"/>
  </g>

  <!-- ACCENT: the frictional press — authorship is molding, not generating -->
  <g fill="none" stroke="#B54A5C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- left jaw -->
    <path d="M470 250 C430 300 430 450 470 500"/>
    <path d="M482 262 C448 308 448 442 482 488" stroke-width="1.7" stroke-opacity=".85"/>
    <!-- right jaw -->
    <path d="M650 250 C690 300 690 450 650 500"/>
    <path d="M638 262 C672 308 672 442 638 488" stroke-width="1.7" stroke-opacity=".85"/>
    <!-- jaw ticks -->
    <path d="M458 268 L472 276" stroke-width="1.6"/>
    <path d="M448 320 L464 326" stroke-width="1.6"/>
    <path d="M448 424 L464 418" stroke-width="1.6"/>
    <path d="M458 482 L472 474" stroke-width="1.6"/>
    <path d="M662 268 L648 276" stroke-width="1.6"/>
    <path d="M672 320 L656 326" stroke-width="1.6"/>
    <path d="M672 424 L656 418" stroke-width="1.6"/>
    <path d="M662 482 L648 474" stroke-width="1.6"/>
    <!-- friction hatches in the bite -->
    <g stroke-width="1.5">
      <path d="M516 318 L546 332"/>
      <path d="M516 348 L546 362"/>
      <path d="M516 378 L546 392"/>
      <path d="M516 408 L546 422"/>
      <path d="M574 332 L604 318"/>
      <path d="M574 362 L604 348"/>
      <path d="M574 392 L604 378"/>
      <path d="M574 422 L604 408"/>
    </g>
    <!-- a single molded contour leaving the press -->
    <path d="M650 375 H704"/>
  </g>

  <!-- RIGHT: the molded form, then a closable rail that can reopen -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <!-- unique outgoing form: taller, uneven header, a single offset inner mark, no generic chrome -->
    <path d="M704 292
             C704 284 710 278 718 278
             H812
             C828 278 834 292 834 308
             V486
             C834 500 824 508 810 508
             H722
             C710 508 704 500 704 488
             Z"/>
    <!-- interior: a short axis and a single considered counter-shape, not the generic card chrome -->
    <path d="M732 318 V460" stroke-width="1.5" stroke-opacity=".55"/>
    <circle cx="776" cy="390" r="22" stroke-width="1.6"/>
    <path d="M776 368 V412" stroke-width="1.4" stroke-opacity=".7"/>
    <path d="M764 402 Q776 418 788 402" stroke-width="1.5"/>

    <!-- closed / repeatable rail -->
    <path d="M834 375 H888"/>
    <rect x="888" y="357" width="36" height="36" rx="2"/>
    <path d="M924 375 H968"/>
    <rect x="968" y="357" width="36" height="36" rx="2"/>
    <path d="M1004 375 H1048"/>
    <rect x="1048" y="357" width="36" height="36" rx="2"/>
    <!-- small committed ticks inside nodes -->
    <g stroke-width="1.4" stroke-opacity=".55">
      <path d="M898 375 H914"/>
      <path d="M978 375 H994"/>
      <path d="M1058 375 H1074"/>
    </g>
    <!-- reopen loop: closed work can return to the press when the work demands it -->
    <path d="M1084 393
             C1084 470 1000 548 860 548
             C760 548 700 520 670 500" stroke-width="1.5" stroke-opacity=".55" stroke-dasharray="6 5"/>
    <path d="M670 500 L678 488 M670 500 L686 506" stroke-width="1.5" stroke-opacity=".55" stroke-dasharray="0"/>
  </g>

  <g font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1.5" fill="#1B2B26" fill-opacity=".45">
    <text x="132" y="628">OPEN / MATERIAL</text>
    <text x="470" y="628">MOLD / AUTHORSHIP</text>
    <text x="888" y="628">CLOSED / REOPENABLE</text>
  </g>

  <text x="60" y="708" font-family="Instrument Serif,Georgia,serif" font-style="italic" font-size="30" fill="#1B2B26">AI's role in the creative process</text>
  <text x="1140" y="708" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" letter-spacing="2" fill="#1B2B26" fill-opacity=".6">FIGMA</text>
</svg>
