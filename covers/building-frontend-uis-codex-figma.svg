<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" data-accent="#1B6B5A">
  <!-- 读本 cover system v1 -->
  <rect width="1200" height="750" fill="#E6E6E6"/>
  <g stroke="#1B2B26" stroke-opacity=".12" stroke-width="1"><path d="M60 0V750M1140 0V750M0 90H1200M0 660H1200"/></g>
  <text x="60" y="62" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26">读本 · NO.43 · AI 设计工作流</text>
  <text x="1140" y="62" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26" fill-opacity=".6">CODE ↔ CANVAS</text>
  <!-- motif: two panels with bidirectional arrows — code tree left, canvas frames right -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <!-- code panel -->
    <path d="M140 200 H460 V560 H140 Z"/>
    <path d="M160 240 H300"/>
    <path d="M160 280 H420"/>
    <path d="M160 320 H380"/>
    <path d="M180 360 H340"/>
    <path d="M180 400 H360"/>
    <path d="M160 440 H300"/>
    <path d="M160 480 H320"/>
    <path d="M180 520 H280"/>
    <!-- canvas panel with frames -->
    <path d="M740 200 H1060 V560 H740 Z"/>
    <path d="M770 240 H900 V360 H770 Z"/>
    <path d="M920 240 H1030 V320 H920 Z"/>
    <path d="M770 390 H1030 V520 H770 Z"/>
    <path d="M800 430 H900"/>
    <path d="M800 460 H960"/>
    <path d="M800 490 H880"/>
  </g>
  <!-- accent: bidirectional MCP bridge -->
  <g fill="none" stroke="#1B6B5A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M500 360 H700"/>
    <path d="M680 340 L700 360 L680 380"/>
    <path d="M520 340 L500 360 L520 380"/>
    <circle cx="600" cy="360" r="18"/>
    <path d="M590 360 H610" stroke-width="2"/>
    <path d="M600 350 V370" stroke-width="2"/>
  </g>
  <g font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="1.5" fill="#1B2B26" fill-opacity=".5">
    <text x="160" y="185">CODEX / CODE</text>
    <text x="760" y="185">FIGMA CANVAS</text>
    <text x="560" y="330">MCP</text>
  </g>
  <text x="60" y="708" font-family="Instrument Serif,Georgia,serif" font-style="italic" font-size="26" fill="#1B2B26">Building frontend UIs with Codex and Figma</text>
  <text x="1140" y="708" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" letter-spacing="2" fill="#1B2B26" fill-opacity=".6">OPENAI</text>
</svg>
