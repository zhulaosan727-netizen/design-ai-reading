<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" data-accent="#A65C2E">
  <!-- 读本 cover system v1 -->
  <rect width="1200" height="750" fill="#E6E6E6"/>
  <g stroke="#1B2B26" stroke-opacity=".12" stroke-width="1"><path d="M60 0V750M1140 0V750M0 90H1200M0 660H1200"/></g>
  <text x="60" y="62" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26">读本 · NO.23 · AI 设计工作流</text>
  <text x="1140" y="62" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26" fill-opacity=".6">FRAME TO WORKING CODE</text>
  <!-- motif: two panels + MCP bridge; accent arrow crossing -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.65" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <!-- left panel: Figma frame -->
    <rect x="160" y="180" width="320" height="400" rx="8"/>
    <rect x="180" y="200" width="280" height="28" rx="3"/>
    <text x="196" y="220" font-family="IBM Plex Mono,monospace" font-size="13" fill="#1B2B26" fill-opacity=".6" stroke="none">FIGMA FRAME</text>
    <!-- nested frame outlines -->
    <rect x="200" y="260" width="240" height="140" rx="4"/>
    <rect x="220" y="280" width="100" height="28" rx="3"/>
    <rect x="340" y="280" width="80" height="28" rx="3"/>
    <rect x="220" y="330" width="200" height="48" rx="3"/>
    <rect x="200" y="430" width="240" height="100" rx="4"/>
    <circle cx="230" cy="470" r="14"/>
    <path d="M260 460 h140"/>
    <path d="M260 485 h100"/>
    <text x="200" y="560" font-family="IBM Plex Mono,monospace" font-size="12" fill="#1B2B26" fill-opacity=".5" stroke="none">components · tokens</text>
    <!-- right panel: code brackets -->
    <rect x="720" y="180" width="320" height="400" rx="8"/>
    <text x="750" y="220" font-family="IBM Plex Mono,monospace" font-size="13" fill="#1B2B26" fill-opacity=".6" stroke="none">WORKING CODE</text>
    <!-- code bracket shapes -->
    <path d="M780 260 v40 h-20 v120 h20 v40"/>
    <path d="M980 260 v40 h20 v120 h-20 v40"/>
    <path d="M810 300 h140"/>
    <path d="M810 340 h100"/>
    <path d="M810 380 h160"/>
    <path d="M810 420 h80"/>
    <text x="750" y="560" font-family="IBM Plex Mono,monospace" font-size="12" fill="#1B2B26" fill-opacity=".5" stroke="none">local copy · no ship yet</text>
    <!-- bridge structure (ink) -->
    <path d="M480 340 H560"/>
    <path d="M640 340 H720"/>
    <rect x="560" y="300" width="80" height="80" rx="6"/>
    <text x="575" y="348" font-family="IBM Plex Mono,monospace" font-size="14" fill="#1B2B26" fill-opacity=".7" stroke="none">MCP</text>
  </g>
  <!-- accent: arrow path crossing the bridge -->
  <g fill="none" stroke="#A65C2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M440 380 C500 380, 520 420, 600 420 C680 420, 700 380, 760 380"/>
    <path d="M748 368 l12 12 l-12 12"/>
  </g>
  <text x="520" y="460" font-family="IBM Plex Mono,monospace" font-size="12" letter-spacing="1" fill="#A65C2E">ROUND-TRIP</text>
  <text x="60" y="708" font-family="Instrument Serif,Georgia,serif" font-style="italic" font-size="28" fill="#1B2B26">How Designers Can Use Claude Code</text>
  <text x="1140" y="708" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" letter-spacing="2" fill="#1B2B26" fill-opacity=".6">FIGMA</text>
</svg>
