  <!-- motif: agent guessing icons (dashed, wrong) vs Code Connect mapping arrow into correct DS components -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <!-- agent head / guesser -->
    <circle cx="200" cy="280" r="42"/>
