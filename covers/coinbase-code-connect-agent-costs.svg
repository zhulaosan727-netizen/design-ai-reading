    <path d="M185 298 Q200 310 215 298"/>
    <!-- thought bubbles with wrong icon guesses (dashed) -->
    <g stroke-dasharray="5 6">
      <circle cx="320" cy="180" r="28"/>
      <path d="M308 172 L332 188 M332 172 L308 188"/>
      <circle cx="400" cy="230" r="24"/>
      <path d="M390 220 H410 V240 H390 Z"/>
      <circle cx="360" cy="320" r="22"/>
      <path d="M352 312 Q360 305 368 312 Q360 328 352 312"/>
    </g>
    <!-- wrong arrows toward hallucinated targets -->
    <path d="M250 260 C280 220 300 200 320 185" stroke-dasharray="4 5"/>
    <path d="M245 290 C290 280 340 250 380 235" stroke-dasharray="4 5"/>
    <path d="M240 310 C280 330 320 330 345 320" stroke-dasharray="4 5"/>
    <!-- Figma frame (design source) -->
    <path d="M520 200 H720 V480 H520 Z"/>
    <path d="M520 240 H720"/>
    <path d="M540 220 H600" stroke-width="1.5"/>
    <path d="M545 280 H695 V320 H545 Z"/>
    <path d="M545 350 H620 V420 H545 Z"/>
    <path d="M640 350 H695 V380 H640 Z"/>
    <path d="M640 400 H695 V420 H640 Z"/>
    <!-- DS library panel (correct components) -->
    <path d="M880 180 H1080 V520 H880 Z"/>
    <path d="M880 220 H1080"/>
    <path d="M900 200 H980" stroke-width="1.5"/>
    <!-- component slots -->
    <path d="M900 250 H1060 V290 H900 Z"/>
    <path d="M900 310 H1060 V350 H900 Z"/>
    <path d="M900 370 H1060 V410 H900 Z"/>
    <path d="M900 430 H1060 V470 H900 Z"/>
  </g>
  <!-- accent: Code Connect mapping arrow into correct DS path -->
  <g fill="none" stroke="#2B5F8C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M720 340 C780 340 820 340 880 340"/>
    <path d="M860 320 L880 340 L860 360"/>
    <!-- highlight correct ListCell + Stepper slots -->
    <path d="M900 310 H1060 V350 H900 Z"/>
    <path d="M900 370 H1060 V410 H900 Z"/>
    <circle cx="830" cy="340" r="6" fill="#2B5F8C" stroke="none"/>
  </g>
  <g font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="1.5" fill="#1B2B26" fill-opacity=".5">
    <text x="155" y="350">AGENT GUESS</text>
    <text x="545" y="185">FIGMA</text>
    <text x="900" y="165">CDS · CODE CONNECT</text>
  </g>
  <text x="60" y="708" font-family="Instrument Serif,Georgia,serif" font-style="italic" font-size="22" fill="#1B2B26">How Coinbase used Code Connect to shrink token costs</text>
  <text x="1140" y="708" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" letter-spacing="2" fill="#1B2B26" fill-opacity=".6">figma.com</text>
</svg>
