  <!-- left: a parts library tray — glass shell, pillar, ringed dots, field lines -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.5" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="96" y="150" width="300" height="460" rx="6"/>
    <!-- glass shell -->
    <circle cx="246" cy="290" r="72"/>
    <circle cx="246" cy="290" r="54" stroke-opacity=".4"/>
    <path d="M204 248C220 232 236 228 254 236" stroke-opacity=".55"/>
    <!-- light pillar -->
    <rect x="132" y="430" width="36" height="130" rx="18"/>
    <path d="M150 430V400" stroke-opacity=".45"/>
    <!-- ringed dots -->
    <circle cx="214" cy="470" r="10"/>
    <circle cx="214" cy="470" r="18" stroke-opacity=".45"/>
    <circle cx="258" cy="508" r="8"/>
    <circle cx="258" cy="508" r="15" stroke-opacity=".45"/>
    <circle cx="300" cy="466" r="7"/>
    <circle cx="300" cy="466" r="13" stroke-opacity=".45"/>
