<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" data-accent="#3A3A9C">
  <!-- 读本 cover system v1 · No.64 · a disposable playground console (accent slider) drives a live environment; generic static artboards sit unused to the left -->
  <rect width="1200" height="750" fill="#E6E6E6"/>
  <g stroke="#1B2B26" stroke-opacity=".12" stroke-width="1"><path d="M60 0V750M1140 0V750M0 90H1200M0 660H1200"/></g>
  <text x="60" y="62" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26">读本 · NO.64 · AI 设计工作流</text>
  <text x="1140" y="62" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26" fill-opacity=".6">SPIN UP, THEN TOSS</text>

  <!-- left: unused generic artboards, slightly askew, static -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.6" stroke-opacity=".55" stroke-linecap="round" stroke-linejoin="round">
    <rect x="92" y="200" width="150" height="200" rx="4"/>
    <path d="M108 228H226M108 248H200"/>
    <rect x="108" y="268" width="118" height="70" rx="3"/>
    <path d="M108 356H210M108 372H186"/>
    <rect x="118" y="248" width="150" height="200" rx="4" transform="rotate(-4 193 348)"/>
    <rect x="100" y="420" width="150" height="110" rx="4"/>
    <path d="M116 444H234M116 462H210M116 480H226"/>
  </g>

  <!-- center: disposable playground console, dashed to show it can be tossed -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="360" y="200" width="280" height="360" rx="14" stroke-dasharray="7 6" stroke-opacity=".55"/>
    <rect x="384" y="224" width="232" height="312" rx="8"/>
    <!-- slider 1 -->
    <path d="M408 262H600"/>
    <circle cx="468" cy="262" r="7"/>
    <!-- slider 2 -->
    <path d="M408 314H600"/>
    <circle cx="540" cy="314" r="7"/>
    <!-- slider 4 (below the accent one) -->
    <path d="M408 418H600"/>
    <circle cx="492" cy="418" r="7"/>
    <!-- toggles -->
    <rect x="408" y="456" width="40" height="22" rx="11"/>
    <circle cx="424" cy="467" r="7"/>
    <rect x="464" y="456" width="40" height="22" rx="11"/>
    <circle cx="488" cy="467" r="7"/>
    <path d="M524 467H600"/>
    <rect x="408" y="494" width="40" height="22" rx="11"/>
    <circle cx="424" cy="505" r="7"/>
    <path d="M464 505H560"/>
  </g>

  <!-- THE key element: the live slider and its feed into the real environment -->
  <g fill="none" stroke="#3A3A9C" stroke-width="2.1" stroke-opacity=".9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M408 366H600"/>
    <circle cx="572" cy="366" r="8"/>
    <!-- feed line from the accent slider to the live window -->
    <path d="M616 366H700"/>
    <!-- the controlled block inside the live window -->
    <rect x="776" y="300" width="236" height="86" rx="6"/>
    <path d="M792 324H996M792 344H960M792 364H980"/>
  </g>

  <!-- right: live environment window -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="700" y="200" width="388" height="360" rx="16"/>
    <!-- window chrome -->
    <path d="M700 244H1088"/>
    <circle cx="728" cy="222" r="6"/>
    <circle cx="752" cy="222" r="6"/>
    <circle cx="776" cy="222" r="6"/>
    <!-- remaining UI, not the controlled block -->
    <path d="M776 416H1012"/>
    <rect x="776" y="436" width="110" height="72" rx="4"/>
    <rect x="902" y="436" width="110" height="72" rx="4"/>
    <path d="M776 530H996"/>
  </g>

  <g font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1.5" fill="#1B2B26" fill-opacity=".45">
    <text x="175" y="556" text-anchor="middle">GENERIC</text>
    <text x="500" y="590" text-anchor="middle">PLAYGROUND</text>
    <text x="894" y="590" text-anchor="middle">LIVE</text>
  </g>

  <text x="60" y="708" font-family="Instrument Serif,Georgia,serif" font-style="italic" font-size="30" fill="#1B2B26">Design by Playground</text>
  <text x="1140" y="708" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" letter-spacing="2" fill="#1B2B26" fill-opacity=".6">LUKE WROBLEWSKI</text>
</svg>
