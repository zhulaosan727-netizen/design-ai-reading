    <path d="M170 185 H320"/>
    <path d="M170 250 H460"/>
    <path d="M170 280 H420"/>
    <path d="M170 310 H440"/>
    <!-- list bullets -->
    <circle cx="185" cy="360" r="5"/>
    <path d="M205 360 H400"/>
    <circle cx="185" cy="395" r="5"/>
    <path d="M205 395 H380"/>
    <circle cx="185" cy="430" r="5"/>
    <path d="M205 430 H360"/>
    <!-- code block stub -->
    <path d="M170 470 H460 V540 H170 Z"/>
    <path d="M190 495 H380 M190 520 H340"/>
    <!-- canvas hinterland (right) with miniature frames -->
    <path d="M620 180 H980 V300 H620 Z"/>
    <path d="M640 210 H780 M640 240 H860 M640 270 H740"/>
    <path d="M700 340 H1020 V460 H700 Z"/>
    <!-- mini diagram nodes -->
    <circle cx="760" cy="400" r="18"/>
    <circle cx="880" cy="400" r="18"/>
    <path d="M778 400 H862"/>
    <path d="M750 520 H980 V600 H750 Z"/>
    <path d="M770 550 H900 M770 575 H860"/>
  </g>
  <!-- accent: ONE connector + embed chip linking md to a canvas node -->
  <g fill="none" stroke="#4A5A9C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M520 340 C560 340 580 400 620 400"/>
    <path d="M600 385 L620 400 L600 415"/>
    <!-- embed chip on md page -->
    <path d="M280 340 H470 V400 H280 Z" stroke-width="2"/>
    <path d="M295 360 H420 M295 380 H390" stroke-width="1.75"/>
  </g>
  <g font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="1.5" fill="#1B2B26" fill-opacity=".5">
    <text x="160" y="145">SPEC.md</text>
    <text x="300" y="330">EMBED</text>
    <text x="640" y="165">CANVAS NODES</text>
  </g>
  <text x="60" y="708" font-family="Instrument Serif,Georgia,serif" font-style="italic" font-size="28" fill="#1B2B26">Introducing Specs: Markdown as a medium</text>
  <text x="1140" y="708" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" letter-spacing="2" fill="#1B2B26" fill-opacity=".6">FIGMA</text>
