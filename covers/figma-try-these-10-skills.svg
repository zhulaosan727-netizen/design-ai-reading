<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" data-accent="#B85A1A">
  <!-- 读本 cover system v1: paper / grid / mono label / line-art motif / one accent -->
  <rect width="1200" height="750" fill="#E6E6E6"/>
  <g stroke="#1B2B26" stroke-opacity=".12" stroke-width="1"><path d="M60 0V750M1140 0V750M0 90H1200M0 660H1200"/></g>
  <text x="60" y="62" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26">读本 · NO.21 · 提示词与 Skill</text>
  <text x="1140" y="62" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26" fill-opacity=".6">SLASH YOUR POINT OF VIEW</text>
  <!-- motif: fan/stack of 10 /skill ticket cards; one accent card /ease-like-miggi peeling forward -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.55" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <!-- back tickets (fan) -->
    <g transform="translate(180,200) rotate(-18)">
      <rect x="0" y="0" width="200" height="90" rx="6"/><text x="20" y="52" font-family="IBM Plex Mono,monospace" font-size="16" fill="#1B2B26" fill-opacity=".55" stroke="none">/xray-scan</text>
    </g>
    <g transform="translate(260,175) rotate(-12)">
      <rect x="0" y="0" width="200" height="90" rx="6"/><text x="16" y="52" font-family="IBM Plex Mono,monospace" font-size="13" fill="#1B2B26" fill-opacity=".55" stroke="none">/find-animation…</text>
    </g>
    <g transform="translate(340,160) rotate(-6)">
      <rect x="0" y="0" width="200" height="90" rx="6"/><text x="16" y="52" font-family="IBM Plex Mono,monospace" font-size="14" fill="#1B2B26" fill-opacity=".55" stroke="none">/camera-pan…</text>
    </g>
    <g transform="translate(420,155) rotate(0)">
      <rect x="0" y="0" width="200" height="90" rx="6"/><text x="16" y="52" font-family="IBM Plex Mono,monospace" font-size="14" fill="#1B2B26" fill-opacity=".55" stroke="none">/better-interface</text>
    </g>
    <g transform="translate(500,165) rotate(6)">
      <rect x="0" y="0" width="200" height="90" rx="6"/><text x="16" y="52" font-family="IBM Plex Mono,monospace" font-size="14" fill="#1B2B26" fill-opacity=".55" stroke="none">/component-handoff</text>
    </g>
    <g transform="translate(580,185) rotate(12)">
      <rect x="0" y="0" width="200" height="90" rx="6"/><text x="16" y="52" font-family="IBM Plex Mono,monospace" font-size="15" fill="#1B2B26" fill-opacity=".55" stroke="none">/create-color</text>
    </g>
    <g transform="translate(220,320) rotate(-14)">
      <rect x="0" y="0" width="200" height="90" rx="6"/><text x="16" y="52" font-family="IBM Plex Mono,monospace" font-size="14" fill="#1B2B26" fill-opacity=".55" stroke="none">/analyze-components</text>
    </g>
    <g transform="translate(320,340) rotate(-4)">
      <rect x="0" y="0" width="200" height="90" rx="6"/><text x="16" y="52" font-family="IBM Plex Mono,monospace" font-size="14" fill="#1B2B26" fill-opacity=".55" stroke="none">/ui-state-expander</text>
    </g>
    <g transform="translate(440,350) rotate(8)">
      <rect x="0" y="0" width="200" height="90" rx="6"/><text x="16" y="52" font-family="IBM Plex Mono,monospace" font-size="13" fill="#1B2B26" fill-opacity=".55" stroke="none">/superfuture-review</text>
    </g>
    <g transform="translate(560,330) rotate(16)">
      <rect x="0" y="0" width="200" height="90" rx="6"/><text x="16" y="52" font-family="IBM Plex Mono,monospace" font-size="14" fill="#1B2B26" fill-opacity=".55" stroke="none">/usability-test…</text>
    </g>
  </g>
  <!-- accent: peeling forward ticket -->
  <g fill="none" stroke="#B85A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(720,240) rotate(-8)">
    <rect x="0" y="0" width="260" height="120" rx="8"/>
    <!-- peel corner fold -->
    <path d="M200 0 L260 0 L260 60 Z" stroke="#B85A1A"/>
    <path d="M200 0 L260 60" stroke-opacity=".5"/>
    <text x="24" y="70" font-family="IBM Plex Mono,monospace" font-size="20" letter-spacing="1" fill="#B85A1A" stroke="none">/ease-like-miggi</text>
  </g>
  <g font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="1" fill="#1B2B26" fill-opacity=".5">
    <text x="180" y="560">10 COMMUNITY SKILLS</text>
    <text x="720" y="400" fill="#B85A1A" fill-opacity=".85">YOUR POINT OF VIEW · PEEL FORWARD</text>
  </g>
  <text x="60" y="708" font-family="Instrument Serif,Georgia,serif" font-style="italic" font-size="28" fill="#1B2B26">Try these 10 skills—and show off your own</text>
  <text x="1140" y="708" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" letter-spacing="2" fill="#1B2B26" fill-opacity=".6">FIGMA BLOG</text>
</svg>
