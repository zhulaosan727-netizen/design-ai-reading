<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" data-accent="#B05A2A">
  <!-- 读本 cover system v1 -->
  <rect width="1200" height="750" fill="#E6E6E6"/>
  <g stroke="#1B2B26" stroke-opacity=".12" stroke-width="1"><path d="M60 0V750M1140 0V750M0 90H1200M0 660H1200"/></g>
  <text x="60" y="62" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26">读本 · NO.37 · 独特审美</text>
  <text x="1140" y="62" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26" fill-opacity=".6">FRICTION IS A FEATURE</text>
  <!-- motif: smooth highway vs intentional speed bump / filter sieve -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <!-- left: smooth highway (no friction) -->
    <path d="M100 280 H480"/>
    <path d="M100 320 H480"/>
    <path d="M100 360 H480"/>
    <!-- dashed lane markers -->
    <path d="M140 320 H180 M220 320 H260 M300 320 H340 M380 320 H420" stroke-dasharray="8 10"/>
    <!-- ideas as small boxes rolling freely -->
    <path d="M150 250 H180 V275 H150 Z"/>
    <path d="M250 245 H280 V275 H250 Z"/>
    <path d="M350 248 H380 V275 H350 Z"/>
    <path d="M420 252 H450 V275 H420 Z"/>
    <!-- arrow of free flow -->
    <path d="M460 300 L490 320 L460 340"/>
    <!-- right: sieve / filter catching shallow ideas -->
    <path d="M720 180 H1000"/>
    <path d="M720 180 V520"/>
    <path d="M1000 180 V520"/>
    <path d="M720 520 H1000"/>
    <!-- sieve mesh -->
    <path d="M760 220 V480 M800 220 V480 M840 220 V480 M880 220 V480 M920 220 V480 M960 220 V480"/>
    <path d="M740 260 H980 M740 300 H980 M740 340 H980 M740 380 H980 M740 420 H980 M740 460 H980"/>
    <!-- caught shallow ideas at top of sieve -->
    <path d="M770 200 H810 V230 H770 Z"/>
    <path d="M850 195 H890 V230 H850 Z"/>
    <path d="M930 202 H970 V230 H930 Z"/>
    <!-- one worthy idea passing through -->
    <path d="M850 500 V560"/>
    <path d="M835 545 L850 560 L865 545"/>
    <path d="M830 575 H870 V605 H830 Z"/>
  </g>
  <!-- accent: intentional speed bump only -->
  <g fill="none" stroke="#B05A2A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M520 320 C560 320 570 260 610 260 C650 260 660 320 700 320"/>
    <path d="M560 360 C575 340 595 340 610 360 C625 340 645 340 660 360" stroke-width="2"/>
  </g>
  <g font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="1.5" fill="#1B2B26" fill-opacity=".5">
    <text x="100" y="230">FRICTIONLESS</text>
    <text x="545" y="400">SPEED BUMP</text>
    <text x="760" y="165">JUDGEMENT FILTER</text>
  </g>
  <text x="60" y="708" font-family="Instrument Serif,Georgia,serif" font-style="italic" font-size="28" fill="#1B2B26">Friction as a Feature</text>
  <text x="1140" y="708" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" letter-spacing="2" fill="#1B2B26" fill-opacity=".6">EMIL KOWALSKI</text>
</svg>
