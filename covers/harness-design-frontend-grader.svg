<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" data-accent="#8B3D5C">
  <!-- 读本 cover system v1 -->
  <rect width="1200" height="750" fill="#E6E6E6"/>
  <g stroke="#1B2B26" stroke-opacity=".12" stroke-width="1"><path d="M60 0V750M1140 0V750M0 90H1200M0 660H1200"/></g>
  <text x="60" y="62" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26">读本 · NO.27 · 独特审美</text>
  <text x="1140" y="62" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26" fill-opacity=".6">GENERATE · EVALUATE</text>
  <!-- motif: generator→output→evaluator loop; bland identical cards vs one distinctive high-score path -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <!-- generator node (left) -->
    <path d="M120 300 H280 V420 H120 Z"/>
    <path d="M145 340 H255 M145 365 H230 M145 390 H245"/>
    <text x="145" y="325" font-family="IBM Plex Mono,monospace" font-size="12" letter-spacing="2" fill="#1B2B26" fill-opacity=".7" stroke="none">GEN</text>
    <!-- bland identical output cards (center cluster) -->
    <path d="M420 200 H540 V300 H420 Z"/><path d="M445 230 H515"/><path d="M450 255 H490 V275 H450 Z"/><path d="M500 255 H520 V275 H500 Z"/>
    <path d="M560 200 H680 V300 H560 Z"/><path d="M585 230 H655"/><path d="M590 255 H630 V275 H590 Z"/><path d="M640 255 H660 V275 H640 Z"/>
    <path d="M490 330 H610 V430 H490 Z"/><path d="M515 360 H585"/><path d="M520 385 H560 V405 H520 Z"/><path d="M570 385 H590 V405 H570 Z"/>
    <!-- evaluator node (right) -->
    <path d="M900 300 H1060 V420 H900 Z"/>
    <path d="M925 345 H1035 M925 370 H1010 M925 395 H1025"/>
    <text x="925" y="330" font-family="IBM Plex Mono,monospace" font-size="12" letter-spacing="2" fill="#1B2B26" fill-opacity=".7" stroke="none">EVAL</text>
    <!-- score ticks on evaluator -->
    <path d="M1040 340 V350 M1040 365 V375 M1040 390 V400" stroke-opacity=".45"/>
  </g>
  <!-- accent: distinctive path scoring high + feedback arrow closing the loop -->
  <g fill="none" stroke="#8B3D5C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- distinctive output frame (breaks bland grid) -->
    <path d="M700 180 H860 V340 H700 Z"/>
    <path d="M720 210 C740 200 780 215 800 205 C820 195 840 220 840 240"/>
    <path d="M720 270 H840"/>
    <path d="M720 300 H800"/>
    <!-- radial marks suggesting originality / non-template -->
    <path d="M780 160 L780 145 M830 170 L845 155 M860 220 L875 220"/>
    <!-- feedback loop arrow: eval → generator (accent = the load-bearing loop) -->
    <path d="M980 420 C980 520 700 560 400 520 C280 500 200 460 200 420"/>
    <path d="M200 420 L185 445 M200 420 L225 440"/>
    <!-- high score mark on distinctive card -->
    <circle cx="830" cy="195" r="8" fill="#8B3D5C" stroke="none"/>
  </g>
  <text x="710" y="365" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="2" fill="#8B3D5C">ORIGINALITY ↑</text>
  <text x="420" y="580" font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="2" fill="#8B3D5C">FEEDBACK LOOP</text>
  <text x="60" y="708" font-family="Instrument Serif,Georgia,serif" font-style="italic" font-size="24" fill="#1B2B26">Harness design for long-running apps</text>
  <text x="1140" y="708" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" letter-spacing="2" fill="#1B2B26" fill-opacity=".6">ANTHROPIC</text>
</svg>
