<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" data-accent="#8A3555">
  <!-- 读本 cover system v1 · No.48 -->
  <rect width="1200" height="750" fill="#E6E6E6"/>
  <g stroke="#1B2B26" stroke-opacity=".12" stroke-width="1"><path d="M60 0V750M1140 0V750M0 90H1200M0 660H1200"/></g>
  <text x="60" y="62" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26">读本 · NO.48 · AI 设计工作流</text>
  <text x="1140" y="62" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26" fill-opacity=".6">CLOSE THE LOOP</text>
  <!-- motif: four-stage loop Research → Explore → Refine → Test, accent on closing arrow -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <!-- stage nodes as rounded squares -->
    <path d="M200 220 H380 V340 H200 Z"/>
    <path d="M220 250 H360" stroke-width="1.5"/>
    <path d="M220 280 H320" stroke-width="1.5"/>
    <path d="M220 310 H340" stroke-width="1.5"/>
    <path d="M820 220 H1000 V340 H820 Z"/>
    <path d="M840 250 H980" stroke-width="1.5"/>
    <path d="M840 280 H940" stroke-width="1.5"/>
    <path d="M840 310 H960" stroke-width="1.5"/>
    <path d="M820 460 H1000 V580 H820 Z"/>
    <path d="M840 490 H980" stroke-width="1.5"/>
    <path d="M840 520 H940" stroke-width="1.5"/>
    <path d="M840 550 H960" stroke-width="1.5"/>
    <path d="M200 460 H380 V580 H200 Z"/>
    <path d="M220 490 H360" stroke-width="1.5"/>
    <path d="M220 520 H320" stroke-width="1.5"/>
    <path d="M220 550 H340" stroke-width="1.5"/>
    <!-- forward arrows: Research→Explore, Explore→Refine, Refine→Test -->
    <path d="M380 280 H820"/>
    <path d="M800 260 L820 280 L800 300"/>
    <path d="M910 340 V460"/>
    <path d="M890 440 L910 460 L930 440"/>
    <path d="M820 520 H380"/>
    <path d="M400 500 L380 520 L400 540"/>
    <!-- center mark: product / Cursor -->
    <circle cx="600" cy="400" r="36"/>
    <path d="M585 400 L600 385 L615 400 L600 415 Z"/>
  </g>
  <!-- accent: closing arrow Test → Research (iterate) -->
  <g fill="none" stroke="#8A3555" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M290 460 V340"/>
    <path d="M270 360 L290 340 L310 360"/>
    <circle cx="290" cy="400" r="7" fill="#8A3555" stroke="none"/>
  </g>
  <g font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="1.5" fill="#1B2B26" fill-opacity=".5">
    <text x="230" y="205">RESEARCH</text>
    <text x="860" y="205">EXPLORE</text>
    <text x="870" y="605">REFINE</text>
    <text x="250" y="605">TEST</text>
    <text x="565" y="455">LOOP</text>
  </g>
  <text x="60" y="708" font-family="Instrument Serif,Georgia,serif" font-style="italic" font-size="28" fill="#1B2B26">AI workflow</text>
  <text x="1140" y="708" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" letter-spacing="2" fill="#1B2B26" fill-opacity=".6">martin.design</text>
</svg>
