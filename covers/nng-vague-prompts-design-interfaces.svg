  <g font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1" fill="#1B2B26" fill-opacity=".45">
    <text x="214" y="628">FRANKENSTEIN</text>
    <text x="818" y="638">HIERARCHY</text>
  </g>
  <text x="60" y="708" font-family="Instrument Serif,Georgia,serif" font-style="italic" font-size="26" fill="#1B2B26">Why Vague Prompts Fail</text>
  <text x="1140" y="708" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" letter-spacing="2" fill="#1B2B26" fill-opacity=".6">NN/G</text>
</svg>
