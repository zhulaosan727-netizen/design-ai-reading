<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" data-accent="#2E6A9C">
  <!-- 读本 cover system v1 · No.54 -->
  <rect width="1200" height="750" fill="#E6E6E6"/>
