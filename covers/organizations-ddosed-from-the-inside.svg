  </g>
  <!-- RIGHT: a calm, spaced product after the gate -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="700" y="168" width="414" height="444" rx="2"/>
    <!-- generous stack: only a few land -->
    <rect x="748" y="214" width="318" height="72" rx="2"/>
    <rect x="748" y="316" width="318" height="72" rx="2"/>
    <rect x="748" y="418" width="318" height="72" rx="2"/>
    <rect x="748" y="520" width="318" height="72" rx="2"/>
    <g stroke-width="1.5" stroke-opacity=".55">
      <path d="M772 242 H980M772 258 H900"/>
      <path d="M772 344 H980M772 360 H900"/>
      <path d="M772 446 H980M772 462 H900"/>
      <path d="M772 548 H980M772 564 H900"/>
    </g>
  </g>
  <!-- accent: the landing gate and the intent rail work must align to -->
  <g fill="none" stroke="#2E4A7A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- gate posts -->
    <path d="M620 200 V576"/>
    <path d="M676 200 V576"/>
    <!-- locked crossbar: the release-channel gate -->
    <path d="M608 372 H688" stroke-width="3"/>
    <path d="M608 390 H688" stroke-width="2"/>
    <!-- a narrow slot through the gate, only at the intent height -->
    <path d="M620 348 H676"/>
    <path d="M620 414 H676"/>
    <!-- intent rail: written ahead, running through the slot into the product -->
    <path d="M86 381 H608" stroke-width="1.8" stroke-dasharray="7 6" stroke-opacity=".85"/>
    <path d="M688 381 H1114" stroke-width="1.8"/>
    <!-- alignment ticks on the product side -->
    <path d="M748 381 H768" stroke-width="2"/>
    <path d="M1046 381 H1066" stroke-width="2"/>
    <!-- crop marks on the landing stage -->
    <path d="M700 150 V168"/><path d="M682 168 H700"/>
    <path d="M1114 150 V168"/><path d="M1114 168 H1132"/>
    <path d="M700 612 V630"/><path d="M682 612 H700"/>
    <path d="M1114 612 V630"/><path d="M1114 612 H1132"/>
    <!-- a short steering arc at the neck: still possible only if you slow the flood at the gate -->
    <path d="M596 330 C584 348 584 414 596 432" stroke-width="1.8"/>
  </g>
  <g font-family="IBM Plex Mono,monospace" font-size="10" letter-spacing="1.5" fill="#1B2B26" fill-opacity=".45">
    <text x="112" y="628">FLOOD OF OUTPUT / ALREADY DONE</text>
    <text x="700" y="628">INTENT RAIL / LANDING GATE</text>
  </g>
  <text x="60" y="708" font-family="Instrument Serif,Georgia,serif" font-style="italic" font-size="24" fill="#1B2B26">Our organizations are being DDoSed from the inside</text>
  <text x="1140" y="708" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" letter-spacing="2" fill="#1B2B26" fill-opacity=".6">KARRI SAARINEN</text>
</svg>
