<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" data-accent="#2E4A7A">
  <!-- 读本 cover system v1 · No.58 · a flood of already-finished work overwhelms the capacity to understand, review, and steer; intent sits ahead of the landing gate -->
  <rect width="1200" height="750" fill="#E6E6E6"/>
  <g stroke="#1B2B26" stroke-opacity=".12" stroke-width="1"><path d="M60 0V750M1140 0V750M0 90H1200M0 660H1200"/></g>
  <text x="60" y="62" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26">读本 · NO.58 · AI 设计工作流</text>
  <text x="1140" y="62" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26" fill-opacity=".6">INTENT BEFORE LANDING</text>
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <!-- LEFT: a dense flood of already-finished work, no hierarchy, rushing toward a neck -->
    <rect x="86" y="168" width="470" height="444" rx="6"/>
    <!-- packet / PR tiles, tighter and more overlapped near the neck -->
    <g id="flood">
      <rect x="112" y="196" width="86" height="54" rx="2"/>
      <rect x="214" y="188" width="78" height="50" rx="2"/>
      <rect x="308" y="200" width="90" height="56" rx="2"/>
      <rect x="414" y="192" width="72" height="48" rx="2"/>
      <rect x="124" y="266" width="80" height="52" rx="2"/>
      <rect x="220" y="254" width="92" height="58" rx="2"/>
      <rect x="328" y="270" width="76" height="50" rx="2"/>
      <rect x="420" y="258" width="88" height="54" rx="2"/>
      <rect x="108" y="336" width="74" height="48" rx="2"/>
      <rect x="198" y="328" width="86" height="54" rx="2"/>
      <rect x="300" y="340" width="80" height="50" rx="2"/>
      <rect x="396" y="324" width="96" height="58" rx="2"/>
      <rect x="118" y="404" width="88" height="54" rx="2"/>
      <rect x="224" y="396" width="78" height="50" rx="2"/>
      <rect x="318" y="410" width="90" height="56" rx="2"/>
      <rect x="424" y="398" width="74" height="48" rx="2"/>
      <rect x="132" y="476" width="82" height="52" rx="2"/>
      <rect x="230" y="468" width="94" height="58" rx="2"/>
      <rect x="340" y="484" width="76" height="50" rx="2"/>
      <rect x="430" y="472" width="84" height="54" rx="2"/>
      <!-- extras overlapping near the neck, tilted slightly by placement tightness -->
      <rect x="456" y="300" width="70" height="46" rx="2" transform="rotate(8 491 323)"/>
      <rect x="448" y="360" width="68" height="44" rx="2" transform="rotate(-6 482 382)"/>
      <rect x="452" y="422" width="66" height="42" rx="2" transform="rotate(5 485 443)"/>
    </g>
    <!-- equal-weight bars: every packet looks equally "done" -->
    <g stroke-width="1.4" stroke-opacity=".5">
      <path d="M126 216 H180M126 230 H164"/>
      <path d="M228 208 H274M228 220 H258"/>
      <path d="M322 220 H378M322 234 H360"/>
      <path d="M428 210 H468M428 222 H454"/>
      <path d="M138 286 H186M138 300 H170"/>
      <path d="M234 274 H290M234 288 H272"/>
      <path d="M342 290 H386M342 304 H372"/>
      <path d="M434 278 H488M434 292 H470"/>
      <path d="M122 354 H164M122 368 H152"/>
