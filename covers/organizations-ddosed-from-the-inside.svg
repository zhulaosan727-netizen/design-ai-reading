      <path d="M314 360 H360M314 374 H346"/>
      <path d="M410 344 H470M410 358 H452"/>
      <path d="M132 424 H186M132 438 H170"/>
      <path d="M238 416 H282M238 430 H268"/>
      <path d="M332 430 H388M332 444 H370"/>
      <path d="M438 416 H480M438 430 H466"/>
      <path d="M146 496 H194M146 510 H180"/>
      <path d="M244 488 H302M244 502 H286"/>
      <path d="M354 504 H398M354 518 H384"/>
      <path d="M444 492 H494M444 506 H478"/>
    </g>
    <!-- flow ticks toward the neck: speed without steering -->
    <g stroke-opacity=".32" stroke-width="1.3">
      <path d="M500 250 L536 250"/>
      <path d="M508 290 L544 290"/>
      <path d="M500 330 L536 330"/>
      <path d="M508 410 L544 410"/>
      <path d="M500 450 L536 450"/>
      <path d="M508 490 L544 490"/>
