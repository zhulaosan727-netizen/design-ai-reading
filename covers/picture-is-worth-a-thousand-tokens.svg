<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" data-accent="#1F8C9A">
  <!-- 读本 cover system v1: paper / grid / mono label / line-art motif / one accent -->
  <rect width="1200" height="750" fill="#E6E6E6"/>
  <g stroke="#1B2B26" stroke-opacity=".12" stroke-width="1"><path d="M60 0V750M1140 0V750M0 90H1200M0 660H1200"/></g>
  <text x="60" y="62" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26">读本 · NO.17 · 独特审美</text>
  <text x="1140" y="62" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26" fill-opacity=".6">PULLED OFF THE DEFAULT</text>
  <!-- motif: a gravity well (the default style) pulling identical landing pages into it; a reference image (accent) knocks one page out of orbit into a new layout -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.6" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <!-- gravity well -->
    <ellipse cx="400" cy="380" rx="260" ry="200" stroke-opacity=".3"/>
    <ellipse cx="400" cy="380" rx="190" ry="146" stroke-opacity=".42"/>
    <ellipse cx="400" cy="380" rx="120" ry="92" stroke-opacity=".55"/>
    <ellipse cx="400" cy="380" rx="54" ry="42"/>
    <!-- identical default pages: centered hero + 3 cards, on the rings -->
    <defs><g id="pg">
      <rect x="0" y="0" width="84" height="62"/>
      <path d="M22 16 H62 M30 25 H54" />
      <rect x="36" y="31" width="12" height="5"/>
      <rect x="8" y="44" width="20" height="12"/><rect x="32" y="44" width="20" height="12"/><rect x="56" y="44" width="20" height="12"/>
    </g></defs>
    <use href="#pg" x="358" y="349"/>
    <use href="#pg" x="198" y="250" stroke-opacity=".8"/>
    <use href="#pg" x="508" y="226" stroke-opacity=".7"/>
    <use href="#pg" x="170" y="452" stroke-opacity=".6"/>
    <use href="#pg" x="470" y="486" stroke-opacity=".6"/>
    <use href="#pg" x="95" y="320" stroke-opacity=".45"/>
    <!-- inward drift arrows -->
    <path d="M150 182 C220 220 280 270 330 320" stroke-opacity=".35" stroke-dasharray="4 7"/>
    <path d="M660 600 C590 540 520 470 470 430" stroke-opacity=".35" stroke-dasharray="4 7"/>
    <g transform="translate(-110 0)">
    <!-- escaping page: half-screen image layout -->
    <rect x="820" y="330" width="250" height="186"/>
    <path d="M840 372 H920 M840 392 H930 M840 412 H900"/>
    <rect x="840" y="438" width="44" height="14"/>
    <path d="M840 480 H930 M840 494 H910" stroke-opacity=".5"/>
    <!-- escape trajectory from the well -->
    <path d="M690 300 C740 290 770 330 812 400"/>
    <path d="M798 392 L813 401 L797 407"/>
    </g>
  </g>
  <g font-family="IBM Plex Mono,monospace" font-size="11" letter-spacing="1" fill="#1B2B26" fill-opacity=".5">
    <text x="400" y="610" text-anchor="middle">THE DEFAULT AESTHETIC</text>
    <text x="710" y="538">NEW LAYOUT</text>
    <text x="750" y="140">REFERENCE · 1 IMAGE ≈ 1000 TOKENS</text>
  </g>
  <!-- accent: the reference image and the half-screen image block it transfers -->
  <g fill="none" stroke="#1F8C9A" stroke-width="2.5" stroke-linejoin="round" transform="translate(-110 0)">
    <rect x="860" y="156" width="170" height="110"/>
    <path d="M872 252 L915 206 L950 236 L975 214 L1018 252"/>
    <circle cx="995" cy="185" r="10"/>
    <rect x="950" y="330" width="120" height="186"/>
    <path d="M945 270 V322" stroke-dasharray="3 6"/>
  </g>
  <text x="60" y="708" font-family="Instrument Serif,Georgia,serif" font-style="italic" font-size="30" fill="#1B2B26">A Picture Is Worth a Thousand Tokens</text>
  <text x="1140" y="708" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" letter-spacing="2" fill="#1B2B26" fill-opacity=".6">REPAINT</text>
</svg>
