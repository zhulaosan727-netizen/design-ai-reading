<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" data-accent="#2E8A5A">
  <!-- 读本 cover system v1 · No.63 · many small guideline files enter a harness; only the scripted critical step (accent) is deterministic, and that path reaches a working prototype -->
  <rect width="1200" height="750" fill="#E6E6E6"/>
  <g stroke="#1B2B26" stroke-opacity=".12" stroke-width="1"><path d="M60 0V750M1140 0V750M0 90H1200M0 660H1200"/></g>
  <text x="60" y="62" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26">读本 · NO.63 · AI 设计工作流</text>
  <text x="1140" y="62" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="15" letter-spacing="3" fill="#1B2B26" fill-opacity=".6">SCRIPT THE CRITICAL STEP</text>

  <!-- left: an index spine and many small guideline files -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M148 170V570"/>
    <!-- file stack; one mid file is pulled out toward the harness -->
    <rect x="168" y="176" width="86" height="32" rx="2"/>
    <path d="M176 186H238M176 196H220"/>
    <rect x="168" y="218" width="86" height="32" rx="2"/>
    <path d="M176 228H238M176 238H214"/>
    <rect x="168" y="260" width="86" height="32" rx="2"/>
    <path d="M176 270H238M176 280H226"/>
    <rect x="188" y="302" width="86" height="32" rx="2"/>
    <path d="M196 312H258M196 322H240"/>
    <rect x="168" y="344" width="86" height="32" rx="2"/>
    <path d="M176 354H238M176 364H218"/>
    <rect x="168" y="386" width="86" height="32" rx="2"/>
    <path d="M176 396H238M176 406H222"/>
    <rect x="168" y="428" width="86" height="32" rx="2"/>
    <path d="M176 438H238M176 448H210"/>
    <rect x="168" y="470" width="86" height="32" rx="2"/>
    <path d="M176 480H238M176 490H230"/>
    <rect x="168" y="512" width="86" height="32" rx="2"/>
    <path d="M176 522H238M176 532H216"/>
    <!-- ticks from spine to files -->
    <path d="M148 192H168M148 234H168M148 276H168M148 318H188M148 360H168M148 402H168M148 444H168M148 486H168M148 528H168"/>
  </g>

  <!-- the capsule / harness -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="390" y="175" width="430" height="400" rx="200"/>
    <!-- three parallel agents enter -->
    <circle cx="430" cy="250" r="8"/>
    <circle cx="430" cy="375" r="8"/>
    <circle cx="430" cy="500" r="8"/>
    <!-- upper path: probabilistic, wanders, dies short of the output -->
    <path d="M438 250C500 250 520 210 590 230C660 250 700 200 780 220"/>
    <circle cx="780" cy="220" r="6"/>
    <path d="M772 212L788 228M788 212L772 228"/>
    <!-- lower path: probabilistic, drops away -->
    <path d="M438 500C510 500 540 545 610 530C680 515 720 560 790 548"/>
    <circle cx="790" cy="548" r="6"/>
    <path d="M782 540L798 556M798 540L782 556"/>
    <!-- middle path: reaches the script block, then the prototype -->
    <path d="M438 375H520"/>
    <path d="M670 375H820"/>
  </g>

  <!-- THE key element: a deterministic script block, accent only here -->
  <g fill="none" stroke="#2E8A5A" stroke-width="2" stroke-opacity=".9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="520" y="336" width="150" height="78" rx="6"/>
    <path d="M540 358H654M540 375H626M540 392H644"/>
  </g>

  <!-- right: a working prototype frame, fed only by the scripted path -->
  <g fill="none" stroke="#1B2B26" stroke-width="1.75" stroke-opacity=".75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="900" y="230" width="200" height="300" rx="16"/>
    <path d="M920 258H1080"/>
    <rect x="920" y="278" width="160" height="90" rx="4"/>
    <path d="M920 390H1080M920 410H1040M920 430H1070"/>
    <!-- city-filter dots, echoing the demo without lettering -->
    <circle cx="936" cy="462" r="8"/>
    <circle cx="968" cy="462" r="8"/>
    <circle cx="1000" cy="462" r="8"/>
    <circle cx="1032" cy="462" r="8"/>
    <circle cx="1064" cy="462" r="8"/>
    <path d="M820 375H900"/>
  </g>

  <text x="60" y="698" font-family="Instrument Serif,Georgia,serif" font-style="italic" font-size="22" fill="#1B2B26">How Zalando built its own AI prototyping environment</text>
  <text x="60" y="726" font-family="Instrument Serif,Georgia,serif" font-style="italic" font-size="22" fill="#1B2B26">on top of its design system</text>
  <text x="1140" y="712" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" letter-spacing="2" fill="#1B2B26" fill-opacity=".6">INTO DESIGN SYSTEMS</text>
</svg>

