    <path d="M360 300 L410 250" stroke-dasharray="4 6"/>
    <path d="M400 340 L450 290" stroke-dasharray="4 6"/>
    <!-- scaffolding grid (Figma → code scaffold) -->
    <path d="M520 200 H780 V420 H520 Z"/>
    <path d="M520 260 H780"/>
    <path d="M600 200 V420"/>
    <path d="M700 200 V420"/>
